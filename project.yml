name: Lector
options:
  bundleIdPrefix: com.magicelklabs
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "V8K8L3ZSD5"
    CODE_SIGN_STYLE: Automatic
packages:
  LectorKit:
    path: LectorKit
targets:
  Lector:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        optional: true
      # Third-party notices, shown from Settings › Acknowledgements.
      - path: Vendor/licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: LectorKit
    info:
      path: Info.plist
      properties:
        CFBundleName: Lector
        CFBundleDisplayName: Lector
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: "© Magicelk Labs"
    entitlements:
      path: Lector.entitlements
      properties:
        # Unsandboxed: Screen Recording and global hot keys are simpler outside the
        # App Store sandbox. Direct distribution only.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magicelklabs.lector
        ENABLE_HARDENED_RUNTIME: true
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LectorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LectorTests
    dependencies:
      - target: Lector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lector:
    build:
      targets:
        Lector: all
    test:
      targets:
        - LectorTests
        - package: LectorKit/LectorKitTests
