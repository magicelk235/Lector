name: Lector
options:
  bundleIdPrefix: com.magicelklabs
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.1"
    # Sparkle compares CFBundleVersion, so it has to move with every release. Keeping
    # it equal to the marketing version leaves one number to bump.
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "V8K8L3ZSD5"
    CODE_SIGN_STYLE: Automatic
packages:
  LectorKit:
    path: LectorKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.5"
targets:
  Lector:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        optional: true
      # Third-party notices, shown from Settings › Acknowledgements.
      - path: Vendor/licenses
        type: folder
        buildPhase: resources
      - path: AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: LectorKit
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleName: Lector
        CFBundleDisplayName: Lector
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Yehonatan Cohen. PolyForm Shield License 1.0.0."
        # Sparkle: appcast.xml is attached to every GitHub release, so
        # /releases/latest/download always resolves to the current feed.
        SUFeedURL: "https://github.com/magicelk235/Lector/releases/latest/download/appcast.xml"
        SUPublicEDKey: "apcUCBF2JH7SFuH8ohkVJGa+zu9Yzu21IAYbvwI1vbM="
        # Install in the background once the user allows checks.
        SUAutomaticallyUpdate: true
    entitlements:
      path: Lector.entitlements
      properties:
        # Unsandboxed: Screen Recording and global hot keys are simpler outside the
        # App Store sandbox. Direct distribution only.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magicelklabs.lector
        ENABLE_HARDENED_RUNTIME: true
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The lectern's red (Resources/Assets.xcassets), the same pair as Palette.accent: toolbar, controls, focus rings.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LectorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LectorTests
    dependencies:
      - target: Lector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lector:
    build:
      targets:
        Lector: all
    test:
      targets:
        - LectorTests
        - package: LectorKit/LectorKitTests
